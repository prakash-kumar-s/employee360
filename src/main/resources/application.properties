spring.application.name=employee360

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/employee360}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

employee360.jwt.secret=${JWT_SECRET}
employee360.jwt.expiration=${JWT_EXPIRATION:3600000}

employee360.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}